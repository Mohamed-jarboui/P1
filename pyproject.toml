[project]
name = "rul"
version = "0.1.0"
description = "Predictive maintenance on NASA C-MAPSS: remaining useful life with calibrated bounds, turned into maintenance decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rul = "rul.cli:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette asks for httpx2; httpx still works for TestClient
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
report = [
    "matplotlib>=3.11.2",
]
