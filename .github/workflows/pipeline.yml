name: Pipeline

# Run by hand (Actions -> Pipeline -> Run workflow): the full experiment on the real data.
# Results, models and figures are uploaded as an artifact; the diff step shows whether the run
# reproduced the committed numbers.
on:
  workflow_dispatch:

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Download, train, evaluate, simulate, drift, README tables, figures
        run: make all
      - name: What changed compared with the committed numbers
        run: git diff --stat -- results README.md docs/figs
      - uses: actions/upload-artifact@v4
        with:
          name: results-and-models
          path: |
            results/
            models/*.joblib
            docs/figs/
            README.md

